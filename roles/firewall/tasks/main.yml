---
- name: Taking prechecks
  ansible.builtin.import_tasks: prechecks.yml
- name: Taking current config backup
  ansible.builtin.import_tasks: backups.yml
- name: Checking and installing firewall if not present
  ansible.builtin.import_tasks: install_firewall.yml
- name: Setting the default zone
  ansible.builtin.import_tasks: set_default_zone.yml
- name: Cheecking the difference b/w allowed and currently allowed ports and services
  ansible.builtin.import_tasks: diff_of_ports_and_services.yml
- name: Allowing permitted ports
  ansible.builtin.import_tasks: allow_services_and_ports.yml
- name: Removing non-permitted ports
  ansible.builtin.import_tasks: remove_services_and_ports.yml
- name: Verifying if all are as wanted
  ansible.builtin.import_tasks: verification.yml
- name: Generating the compliance report
  ansible.builtin.import_tasks: compliance.yml
